# ~/.config/hypr/hypridle.conf
# hypridle watches for idle time and runs commands on timeout/resume.
# Resuming on activity (mouse move, keypress) is automatic: any input
# ends the idle state and fires on-resume for that listener.

general {
    lock_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Turn the screen off after 5 minutes idle, back on on activity.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
