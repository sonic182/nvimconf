# ~/.config/hypr/hyprlock.conf
# Style: MrVivekRajan/Hyprlock-Styles — Style-1, adapted:
#  - background is lock_background.jpg: wallpaper.jpg with a blurred/darkened
#    panel baked onto the right 34% (BMW is on the left of the source photo)
#  - font swapped from SF Pro Display to JetBrainsMono Nerd Font (installed here)
#  - profile-photo image block dropped (no equivalent asset in this repo)
#  - all elements right-aligned to sit on the blurred panel

# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/lock_background.jpg
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# GREETINGS
label {
    monitor =
    text = Welcome!
    color = rgba(216, 222, 233, .75)
    font_size = 55
    font_family = JetBrainsMono Nerd Font
    position = -150, 320
    halign = right
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, .75)
    font_size = 40
    font_family = JetBrainsMono Nerd Font
    position = -240, 240
    halign = right
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(216, 222, 233, .75)
    font_size = 19
    font_family = JetBrainsMono Nerd Font
    position = -217, 175
    halign = right
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 320, 55
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 1)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = -160, -140
    halign = right
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 0
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -275, -140
    halign = right
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##ffffff99">🔒  Enter Pass</span></i>
    hide_input = false
    position = -160, -220
    halign = right
    valign = center
}
